<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Campus Cafe</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">Menu</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

<section>
    <h2>Contact Us</h2>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="number">Number:</label>
        <input type="number" id="number" name="number">

        <label for="date">Date:</label>
        <input type="date" id="date" name="date">

        <p>Order Type:</p>

        <input type="radio" id="pickup" name="order" value="pickup">
        <label for="pickup">Pickup</label>

        <input type="radio" id="dinein" name="order" value="dinein">
        <label for="dinein">Dine in</label>

        <p>Extras:</p>

        <input type="checkbox" id="milk" name="extras" value="milk">
        <label for="milk">Milk</label>

        <input type="checkbox" id="sugar" name="extras" value="sugar">
        <label for="sugar">Sugar</label>

        <label for="drink">Favorite Drink:</label>
        <select id="drink" name="drink">
            <option value="coffee">Coffee</option>
            <option value="latte">Latte</option>
            <option value="tea">Tea</option>
        </select>

        <label for="message">Message:</label>
        <textarea id="message" name="message"></textarea>

        <button type="submit">Send</button>

    </form>
</section>

</main>

<footer>
    <p>&copy; 2026 Campus Cafe</p>
</footer>

</body>
</html>
